<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">My Fashion Store | Official Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-nav { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.96); }
    #slider-track { display: flex; width: 600%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    .slide-card { width: calc(100% / 6); flex-shrink: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen antialiased select-none">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 glass-nav border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer select-none" onclick="navigate('home')">
        <span class="font-black text-lg tracking-wider">MY FASHION STORE</span>
      </div>
      <nav class="hidden md:flex items-center space-x-5 text-xs font-bold tracking-wide text-gray-700">
        <button type="button" onclick="navigate('home')" class="hover:text-black py-1 px-2 rounded">Home</button>
        <button type="button" onclick="navigate('all')" class="hover:text-black py-1 px-2 rounded">All Collection</button>
        <button type="button" onclick="navigate('myorders')" class="text-blue-600 py-1 px-2 rounded">My Orders</button>
      </nav>
      <div class="flex items-center space-x-3">
        <button type="button" onclick="toggleCart(true)" class="relative p-1.5 text-gray-800 hover:text-black">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWS -->
  <main class="flex-grow">
    <!-- HOME VIEW -->
    <div id="page-home" class="page-view max-w-7xl mx-auto px-4 py-4 space-y-4">
      <div class="border-b pb-2 flex justify-between items-center">
        <h2 class="text-base md:text-xl font-black uppercase text-gray-900">Featured Store Products</h2>
        <button type="button" onclick="navigate('all')" class="text-xs font-bold text-blue-600 hover:underline">View All Collection <i class="fa-solid fa-arrow-right ml-1"></i></button>
      </div>
      <div id="home-product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4 pt-1"></div>
    </div>

    <!-- ALL COLLECTION VIEW -->
    <div id="page-all" class="page-view hidden max-w-7xl mx-auto px-4 py-6 space-y-4">
      <div class="border-b pb-3 flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-black uppercase text-gray-900">All Products Catalog</h1>
        <button type="button" onclick="navigate('home')" class="text-xs font-bold text-gray-600 hover:text-black">Back to Home</button>
      </div>
      <div id="all-product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4 pt-2"></div>
    </div>

    <!-- MY ORDERS VIEW -->
    <div id="page-myorders" class="page-view hidden max-w-3xl mx-auto px-4 py-6">
      <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm space-y-4">
        <h2 class="text-lg font-black border-b pb-2">My Orders & Live Timeline</h2>
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-1.5">
          <label class="block text-[11px] font-bold text-gray-700">Enter 10-digit Mobile Number:</label>
          <div class="flex gap-2">
            <input type="text" id="cust-search-phone" placeholder="Mobile number" class="w-full border p-1.5 text-xs rounded-lg font-semibold">
            <button type="button" onclick="fetchCustomerCloudOrders()" class="bg-black text-white px-4 py-1.5 rounded-lg text-xs font-bold">Search</button>
          </div>
        </div>
        <div id="customer-orders-container" class="space-y-3 pt-2"></div>
      </div>
    </div>

    <!-- ADMIN PORTAL VIEW -->
    <div id="page-sec-portal-9921" class="page-view hidden max-w-6xl mx-auto px-4 py-8">
      <div id="admin-login-box" class="max-w-sm mx-auto bg-white p-6 rounded-2xl border shadow-md text-center space-y-3">
        <h3 class="text-lg font-extrabold">Admin Login</h3>
        <input type="password" id="admin-pin-input" placeholder="Enter Security PIN" class="w-full border p-2 rounded text-center font-bold text-xs">
        <button type="button" onclick="checkAdminAuth()" class="w-full bg-black text-white py-2 rounded text-xs font-bold uppercase">Unlock</button>
      </div>

      <div id="admin-panel" class="hidden space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-xl font-black">Management Dashboard</h2>
          <button type="button" onclick="adminLogout()" class="text-xs bg-red-50 text-red-700 px-3 py-1 rounded font-bold">Logout</button>
        </div>

        <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="text-sm font-bold">Publish New Apparel (HD Photos)</h3>
            <button type="button" onclick="manualSyncAllProductsToCloud()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">Sync to Cloud ☁️</button>
          </div>
          
          <form onsubmit="handleProductAdd(event)" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
            <div><input type="text" id="prod-title" required placeholder="Product Title" class="w-full border p-1.5 rounded"></div>
            <div>
              <select id="prod-category" class="w-full border p-1.5 rounded bg-white">
                <option value="Men">Men</option>
                <option value="Women">Women</option>
                <option value="Kids">Kids</option>
              </select>
            </div>
            <div><input type="number" id="prod-price" required placeholder="Price (₹)" class="w-full border p-1.5 rounded"></div>
            <div><input type="text" id="prod-sizes" value="S, M, L, XL" class="w-full border p-1.5 rounded"></div>
            <div class="md:col-span-2"><textarea id="prod-desc" placeholder="Description" class="w-full border p-1.5 rounded"></textarea></div>
            
            <div class="md:col-span-2 bg-gray-50 p-3 rounded border space-y-2">
              <label class="block font-bold">Product Photos (HD)</label>
              <input type="file" id="prod-files-input" accept="image/*" multiple onchange="handleQueuePhotoSelection(event, 'add')" class="w-full border p-1 rounded bg-white">
              <div id="add-photo-queue" class="flex flex-wrap gap-2 pt-1"></div>
            </div>

            <div class="md:col-span-2">
              <button type="submit" id="prod-submit-btn" class="bg-black text-white px-5 py-2 rounded text-xs font-bold uppercase">Publish Product</button>
            </div>
          </form>
        </div>
        
        <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
          <h3 class="text-sm font-bold border-b pb-2">Manage Products</h3>
          <div id="admin-product-management-list" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- CART MODAL -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col p-5 shadow-2xl overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-sm font-bold uppercase">Shopping Bag</h3>
        <button type="button" onclick="toggleCart(false)" class="text-2xl font-bold">&times;</button>
      </div>
      <div id="cart-items" class="py-3 space-y-2 flex-grow overflow-y-auto border-b"></div>
      <div class="pt-3 space-y-2 text-xs">
        <div class="flex justify-between font-extrabold text-sm text-black">
          <span>Total:</span>
          <span id="cart-total">₹0</span>
        </div>
        <button type="button" onclick="processOrderDirect()" class="w-full bg-black text-white py-2.5 text-xs font-bold rounded uppercase">Complete Order</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-white border-t mt-8 py-4 text-center">
    <button type="button" onclick="navigate('sec-portal-9921')" class="text-[10px] bg-gray-100 text-gray-600 font-bold px-3 py-1 rounded border">Admin Login</button>
  </footer>

  <!-- SCRIPT -->
  <script>
    // ⚠️ आपका सही Firebase Database लिंक यहाँ सेट है जिससे सारे 43 प्रोडक्ट्स वापस आ जाएंगे
    const FIREBASE_DB_URL = "https://myfashionstore-a7200-default-rtdb.firebaseio.com";

    let storeSettings = JSON.parse(localStorage.getItem('mfs_settings_v21')) || { pin: "adeet2009" };
    let products = [];
    let cart = [];
    let addPhotosQueue = [];

    window.navigate = function(view) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById('page-' + view);
      if (target) target.classList.remove('hidden');
      else document.getElementById('page-home').classList.remove('hidden');

      if (view === 'home') renderHomeProducts(products);
      else if (view === 'all') renderAllProducts(products);
      window.scrollTo(0, 0);
    };

    function renderHomeProducts(items) {
      const grid = document.getElementById('home-product-grid');
      if (!grid) return;
      grid.innerHTML = items.map(p => getProductCardHTML(p)).join('');
    }

    function renderAllProducts(items) {
      const grid = document.getElementById('all-product-grid');
      if (!grid) return;
      grid.innerHTML = items.map(p => getProductCardHTML(p)).join('');
    }

    function getProductCardHTML(p) {
      const mainImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image || '');
      return `
        <div class="bg-white rounded-xl border p-3 flex flex-col justify-between shadow-sm">
          <div>
            <img src="${mainImg}" class="w-full h-44 object-contain bg-white rounded-lg mb-2">
            <span class="text-[9px] text-gray-400 font-bold uppercase">${p.category}</span>
            <h3 class="font-bold text-xs line-clamp-1">${p.title}</h3>
          </div>
          <div class="flex items-center justify-between pt-2">
            <span class="font-extrabold text-xs">₹${p.price}</span>
            <button type="button" onclick="addToCart(${p.id})" class="bg-black text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase">Add to Cart</button>
          </div>
        </div>
      `;
    }

    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleQueuePhotoSelection(event, context) {
      const files = Array.from(event.target.files);
      for (let file of files) {
        const compressed = await compressImage(file);
        addPhotosQueue.push(compressed);
      }
      event.target.value = '';
      renderQueuePhotos();
    }

    function renderQueuePhotos() {
      const container = document.getElementById('add-photo-queue');
      if (!container) return;
      container.innerHTML = addPhotosQueue.map((url, idx) => `
        <div class="relative w-14 h-14 rounded border bg-white p-0.5">
          <img src="${url}" class="w-full h-full object-contain">
          <button type="button" onclick="addPhotosQueue.splice(${idx},1);renderQueuePhotos()" class="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 rounded-full text-[9px]">✕</button>
        </div>
      `).join('');
    }

    async function fetchCloudProducts() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/products.json`);
        const data = await res.json();
        if (data) {
          products = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
        }
      } catch (err) {
        console.error("Fetch error:", err);
      } finally {
        renderHomeProducts(products);
      }
    }

    async function syncProductsToCloud() {
      try {
        await fetch(`${FIREBASE_DB_URL}/products.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(products)
        });
      } catch (err) {
        console.error("Sync error:", err);
      }
    }

    async function manualSyncAllProductsToCloud() {
      await syncProductsToCloud();
      alert("✅ Synced successfully to Firebase Cloud!");
    }

    async function handleProductAdd(e) {
      e.preventDefault();
      if (addPhotosQueue.length === 0) return alert('⚠️ Select at least 1 photo!');

      const newProd = {
        id: Date.now(),
        title: document.getElementById('prod-title').value.trim(),
        category: document.getElementById('prod-category').value,
        price: Number(document.getElementById('prod-price').value),
        sizes: document.getElementById('prod-sizes').value.split(',').map(s => s.trim()),
        description: document.getElementById('prod-desc').value.trim(),
        image: addPhotosQueue[0],
        images: [...addPhotosQueue]
      };

      products.unshift(newProd);
      await syncProductsToCloud();

      renderHomeProducts(products);
      renderAdminProductManagement();
      e.target.reset();
      addPhotosQueue = [];
      renderQueuePhotos();
      alert('🎉 Product published successfully on Cloud!');
    }

    function renderAdminProductManagement() {
      const container = document.getElementById('admin-product-management-list');
      if (!container) return;
      container.innerHTML = products.map(p => `
        <div class="flex items-center justify-between border p-2 rounded text-xs bg-gray-50">
          <span class="font-bold">${p.title} - ₹${p.price}</span>
          <button type="button" onclick="deleteProductById(${p.id})" class="text-red-600 font-bold">Delete 🗑️</button>
        </div>
      `).join('');
    }

    async function deleteProductById(id) {
      if (!confirm("Delete this product?")) return;
      products = products.filter(p => p.id !== id);
      await syncProductsToCloud();
      renderHomeProducts(products);
      renderAdminProductManagement();
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (prod) {
        cart.push(prod);
        updateCartDisplay();
        toggleCart(true);
      }
    }

    function toggleCart(show) { document.getElementById('cart-modal').classList.toggle('hidden', !show); }

    function updateCartDisplay() {
      document.getElementById('cart-count').innerText = cart.length;
      const list = document.getElementById('cart-items');
      let subtotal = 0;
      list.innerHTML = cart.map((item, idx) => {
        subtotal += item.price;
        return `<div class="flex justify-between text-xs py-1 border-b"><span>${item.title}</span><b>₹${item.price}</b></div>`;
      }).join('');
      document.getElementById('cart-total').innerText = '₹' + subtotal;
    }

    async function processOrderDirect() {
      if (cart.length === 0) return alert('Cart is empty!');
      const orderData = {
        orderId: 'MFS-' + Math.floor(100000 + Math.random() * 900000),
        items: cart.map(i => i.title).join(', '),
        total: document.getElementById('cart-total').innerText,
        status: "Order Confirmed",
        phone: "9876543210",
        date: new Date().toLocaleDateString()
      };
      await fetch(`${FIREBASE_DB_URL}/orders.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });
      cart = [];
      updateCartDisplay();
      toggleCart(false);
      alert('Order placed successfully!');
    }

    function checkAdminAuth() {
      if (document.getElementById('admin-pin-input').value === storeSettings.pin) {
        document.getElementById('admin-login-box').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderAdminProductManagement();
      } else {
        alert('Incorrect PIN!');
      }
    }

    function adminLogout() { location.reload(); }

    window.addEventListener('DOMContentLoaded', () => {
      fetchCloudProducts();
    });
  </script>
</body>
</html>
