<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title id="site-title">My Fashion Store | Official Store</title>
  <meta name="robots" content="index, follow">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-nav { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.96); }
    #slider-track { display: flex; width: 600%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    .slide-card { width: calc(100% / 6); flex-shrink: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen antialiased select-none">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 glass-nav border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer font-black text-lg" onclick="navigate('home')">
        My Fashion Store
      </div>
      <nav class="hidden md:flex items-center space-x-4 text-xs font-bold">
        <button type="button" onclick="navigate('home')">Home</button>
        <button type="button" onclick="navigate('all')">Collection</button>
        <button type="button" onclick="navigate('sec-portal-9921')">Admin Portal</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow">
    <!-- HOME PAGE -->
    <div id="page-home" class="page-view max-w-7xl mx-auto px-4 py-6 space-y-4">
      <h2 class="text-xl font-black uppercase">Store Products</h2>
      <div id="home-product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <!-- ALL COLLECTION -->
    <div id="page-all" class="page-view hidden max-w-7xl mx-auto px-4 py-6 space-y-4">
      <h2 class="text-xl font-black uppercase">All Products</h2>
      <div id="all-product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <!-- ADMIN PORTAL -->
    <div id="page-sec-portal-9921" class="page-view hidden max-w-4xl mx-auto px-4 py-8">
      <div id="admin-login-box" class="max-w-sm mx-auto bg-white p-6 rounded-2xl border shadow-md text-center space-y-3">
        <h3 class="text-lg font-extrabold">Admin Login</h3>
        <input type="password" id="admin-pin-input" placeholder="Enter PIN (adeet2009)" class="w-full border p-2 rounded text-center text-xs">
        <button type="button" onclick="checkAdminAuth()" class="w-full bg-black text-white py-2 rounded text-xs font-bold">Login</button>
      </div>

      <div id="admin-panel" class="hidden space-y-4 bg-white p-6 rounded-2xl border">
        <h2 class="text-lg font-black border-b pb-2">Admin Dashboard</h2>
        
        <form onsubmit="handleProductAdd(event)" class="space-y-3 text-xs">
          <input type="text" id="prod-title" required placeholder="Product Title" class="w-full border p-2 rounded">
          <select id="prod-category" class="w-full border p-2 rounded bg-white">
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
          </select>
          <input type="number" id="prod-price" required placeholder="Price (₹)" class="w-full border p-2 rounded">
          <input type="text" id="prod-sizes" value="S, M, L, XL" class="w-full border p-2 rounded">
          <textarea id="prod-desc" placeholder="Description" class="w-full border p-2 rounded"></textarea>
          <input type="file" id="prod-file" accept="image/*" onchange="handleSinglePhoto(event)" class="w-full border p-1 rounded">
          <button type="submit" class="w-full bg-black text-white py-2 rounded font-bold uppercase">Publish Product</button>
        </form>

        <div class="pt-4 border-t">
          <h3 class="font-bold mb-2">Manage Products</h3>
          <div id="admin-product-management-list" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const FIREBASE_DB_URL = "https://myfashionstore-a7200-default-rtdb.firebaseio.com";
    let products = JSON.parse(localStorage.getItem('mfs_instant_cache_v21')) || [];
    let uploadedImage = "";

    window.navigate = function(view) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById('page-' + view);
      if (target) target.classList.remove('hidden');
      else document.getElementById('page-home').classList.remove('hidden');
      if (view === 'home') renderProducts(products);
      if (view === 'all') renderAllProducts(products);
      if (view === 'sec-portal-9921') renderAdminList();
      window.scrollTo(0, 0);
    };

    function renderProducts(items) {
      const grid = document.getElementById('home-product-grid');
      if (!grid) return;
      if (!items || items.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-6 text-xs">No products found. Add from Admin Portal.</p>';
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-xl border p-3 flex flex-col justify-between shadow-xs">
          <img src="${p.image || ''}" class="w-full h-40 object-contain bg-white rounded-lg mb-2">
          <h3 class="font-bold text-xs truncate">${p.title}</h3>
          <span class="font-black text-xs text-black mt-1">₹${p.price}</span>
        </div>
      `).join('');
    }

    function renderAllProducts(items) {
      const grid = document.getElementById('all-product-grid');
      if (!grid) return;
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-xl border p-3 flex flex-col justify-between shadow-xs">
          <img src="${p.image || ''}" class="w-full h-40 object-contain bg-white rounded-lg mb-2">
          <h3 class="font-bold text-xs truncate">${p.title}</h3>
          <span class="font-black text-xs text-black mt-1">₹${p.price}</span>
        </div>
      `).join('');
    }

    async function fetchCloudProducts() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/products.json`);
        const data = await res.json();
        if (data) {
          products = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
          localStorage.setItem('mfs_instant_cache_v21', JSON.stringify(products));
          renderProducts(products);
        }
      } catch (err) {
        console.error("Cloud fetch error:", err);
      }
    }

    async function syncToCloud() {
      try {
        localStorage.setItem('mfs_instant_cache_v21', JSON.stringify(products));
        const obj = {};
        products.forEach(p => { obj[p.id] = p; });
        await fetch(`${FIREBASE_DB_URL}/products.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj)
        });
      } catch (err) {
        console.error("Cloud sync error:", err);
      }
    }

    function handleSinglePhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => { uploadedImage = event.target.result; };
        reader.readAsDataURL(file);
      }
    }

    async function handleProductAdd(e) {
      e.preventDefault();
      const newProd = {
        id: Date.now(),
        title: document.getElementById('prod-title').value.trim(),
        category: document.getElementById('prod-category').value,
        price: Number(document.getElementById('prod-price').value),
        sizes: document.getElementById('prod-sizes').value.split(',').map(s => s.trim()),
        description: document.getElementById('prod-desc').value.trim(),
        image: uploadedImage || "https://via.placeholder.com/150"
      };

      products.unshift(newProd);
      renderProducts(products);
      renderAdminList();
      e.target.reset();
      uploadedImage = "";
      alert('🎉 Product added successfully!');
      await syncToCloud();
    }

    function renderAdminList() {
      const container = document.getElementById('admin-product-management-list');
      if (!container) return;
      container.innerHTML = products.map(p => `
        <div class="flex justify-between items-center border p-2 rounded text-xs">
          <span><b>${p.title}</b> - ₹${p.price}</span>
          <button type="button" onclick="deleteProd(${p.id})" class="text-red-600 font-bold">Delete</button>
        </div>
      `).join('');
    }

    async function deleteProd(id) {
      if (!confirm("Delete product?")) return;
      products = products.filter(p => Number(p.id) !== Number(id));
      renderProducts(products);
      renderAdminList();
      await syncToCloud();
    }

    function checkAdminAuth() {
      if (document.getElementById('admin-pin-input').value === "adeet2009") {
        document.getElementById('admin-login-box').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderAdminList();
      } else {
        alert("Incorrect PIN!");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
      fetchCloudProducts();
    });
  </script>
</body>
</html>
