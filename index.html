<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard</title>
  <!-- STRICT NO-INDEX: Google bots are completely blocked here -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 md:p-8">

  <!-- AUTH BOX -->
  <div id="auth-box" class="max-w-sm mx-auto bg-white p-6 rounded-2xl border shadow-md my-12 text-center space-y-3">
    <i class="fa-solid fa-lock text-3xl text-gray-700"></i>
    <h2 class="text-base font-bold">Authorized Management Access</h2>
    <input type="password" id="pin-input" placeholder="Security PIN" class="w-full border p-2 rounded-lg text-center font-bold text-xs">
    <button onclick="checkAccess()" class="w-full bg-black text-white py-2 rounded-lg text-xs font-bold uppercase">Unlock</button>
  </div>

  <!-- ADMIN WORKSPACE -->
  <div id="admin-workspace" class="hidden max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl border">
      <div>
        <h1 class="text-base font-black uppercase">Store Backend Control</h1>
        <p class="text-xs text-gray-500">Live Orders & Product Management</p>
      </div>
      <button onclick="location.reload()" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded font-bold border border-red-200">Logout</button>
    </div>

    <!-- PUBLISH ITEM FORM -->
    <div class="bg-white p-5 rounded-2xl border space-y-3">
      <h3 class="text-xs font-black uppercase border-b pb-2">Publish New Product (With Supplier Link)</h3>
      <form onsubmit="handlePublish(event)" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block font-bold mb-1">Product Title</label>
          <input type="text" id="p-title" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block font-bold mb-1">Category</label>
          <select id="p-cat" class="w-full border p-2 rounded bg-white">
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
          </select>
        </div>
        <div>
          <label class="block font-bold mb-1">Selling Price (₹)</label>
          <input type="number" id="p-price" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block font-bold mb-1">Sizes (Comma-separated)</label>
          <input type="text" id="p-sizes" value="Free Size" class="w-full border p-2 rounded">
        </div>
        <div class="md:col-span-2">
          <label class="block font-bold text-blue-700 mb-1">Supplier Link (Meesho/Flipkart URL - Never visible to customers)</label>
          <input type="url" id="p-ref" placeholder="Paste Meesho or Flipkart product URL..." class="w-full border border-blue-300 bg-blue-50/50 p-2 rounded">
        </div>
        <div class="md:col-span-2">
          <label class="block font-bold mb-1">Photos (Select 1-by-1 or together)</label>
          <input type="file" id="p-files" accept="image/*" multiple onchange="handleQueuePhotos(event)" class="w-full border p-2 rounded bg-gray-50">
          <div id="photo-queue-preview" class="flex gap-2 mt-2"></div>
        </div>
        <div class="md:col-span-2">
          <button type="submit" id="submit-btn" class="bg-black text-white px-5 py-2.5 rounded-lg font-bold uppercase">Publish to Store</button>
        </div>
      </form>
    </div>

    <!-- LIVE ORDERS LIST -->
    <div class="bg-white p-5 rounded-2xl border space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-xs font-black uppercase">Live Customer Orders</h3>
        <button onclick="loadOrders()" class="text-xs font-bold text-blue-600">Refresh Orders</button>
      </div>
      <div id="orders-container" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://myfashionstore-a7200-default-rtdb.firebaseio.com";
    // Default PIN: 9876 (Encrypted SHA-256 Hash - PIN is not visible in code)
    const HASH_AUTH = "cd561b3696a9cf518a4a58ebbc1b9db1d604b360b37ff9386348efc63c32b500";

    let photoQueue = [];

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkAccess() {
      const pin = document.getElementById('pin-input').value;
      if (await sha256(pin) === HASH_AUTH) {
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('admin-workspace').classList.remove('hidden');
        loadOrders();
      } else {
        alert('Access Denied');
      }
    }

    function compressImg(file) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = (img.height * 1200) / img.width;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          };
          img.src = e.target.result;
        };
        r.readAsDataURL(file);
      });
    }

    async function handleQueuePhotos(e) {
      const files = Array.from(e.target.files);
      for (let f of files) {
        if (photoQueue.length < 5) photoQueue.push(await compressImg(f));
      }
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('photo-queue-preview');
      container.innerHTML = photoQueue.map((u, i) => `
        <div class="relative w-14 h-14 border rounded-lg overflow-hidden">
          <img src="${u}" class="w-full h-full object-cover">
          <button type="button" onclick="photoQueue.splice(${i}, 1); renderQueue();" class="absolute top-0 right-0 bg-red-600 text-white text-[9px] w-4 h-4">✕</button>
        </div>
      `).join('');
    }

    async function handlePublish(e) {
      e.preventDefault();
      if (photoQueue.length === 0) return alert('Select at least 1 image');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Publishing...';

      const newProd = {
        id: Date.now(),
        title: document.getElementById('p-title').value.trim(),
        category: document.getElementById('p-cat').value,
        price: Number(document.getElementById('p-price').value),
        sizes: document.getElementById('p-sizes').value.split(',').map(s => s.trim()),
        _refKey: document.getElementById('p-ref').value.trim(),
        images: [...photoQueue]
      };

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/products.json`);
        const existing = await res.json() || [];
        const catalog = Array.isArray(existing) ? existing : Object.values(existing);
        catalog.unshift(newProd);

        await fetch(`${FIREBASE_DB_URL}/products.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(catalog)
        });

        alert('Product published to store!');
        e.target.reset();
        photoQueue = [];
        renderQueue();
      } catch(err) {
        alert('Upload failed');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Publish to Store';
      }
    }

    async function loadOrders() {
      const c = document.getElementById('orders-container');
      c.innerHTML = '<p class="text-xs text-gray-400">Loading orders...</p>';
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/orders.json`);
        const data = await res.json();
        if (!data) return c.innerHTML = '<p class="text-xs text-gray-400">No orders received.</p>';

        const orders = Object.values(data).reverse();
        c.innerHTML = orders.map(o => `
          <div class="border p-3 rounded-xl bg-gray-50 text-xs space-y-1">
            <div class="flex justify-between font-bold">
              <span class="text-blue-700">${o.orderId} - ${o.name} (${o.phone})</span>
              <span>${o.total}</span>
            </div>
            <p><strong>Items:</strong> ${o.items}</p>
            <p><strong>Address:</strong> ${o.address}</p>
            ${o._refKey ? `
              <a href="${o._refKey}" target="_blank" class="inline-block bg-blue-600 text-white font-bold px-3 py-1 rounded text-[10px] mt-1">
                Open Supplier / Meesho Item 🛍️
              </a>
            ` : '<span class="text-[10px] text-gray-400">No supplier link attached</span>'}
          </div>
        `).join('');
      } catch(e) {
        c.innerHTML = '<p class="text-xs text-red-500">Failed to load orders</p>';
      }
    }
  </script>
</body>
</html>
